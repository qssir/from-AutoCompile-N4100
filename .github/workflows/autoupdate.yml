name: Auto Update & Compile

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  check_update:
    runs-on: ubuntu-latest
    outputs:
      update_needed: ${{ steps.check.outputs.update_needed }}
      pkg_version: ${{ steps.check.outputs.pkg_version }}
      latest_daed_full: ${{ steps.check.outputs.latest_daed_full }}
      latest_daed_short: ${{ steps.check.outputs.latest_daed_short }}
      latest_wing_short: ${{ steps.check.outputs.latest_wing_short }}
      latest_core_short: ${{ steps.check.outputs.latest_core_short }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Check Upstream Updates
        id: check
        run: |
          DAED_JSON=$(curl -s https://api.github.com/repos/daeuniverse/daed/commits/main)
          WING_JSON=$(curl -s https://api.github.com/repos/daeuniverse/dae-wing/commits/main)
          CORE_JSON=$(curl -s https://api.github.com/repos/daeuniverse/dae/commits/main)

          UPSTREAM_DAED_FULL=$(echo "$DAED_JSON" | jq -r '.sha')
          UPSTREAM_DAED=$(echo "$UPSTREAM_DAED_FULL" | cut -b 1-7)
          UPSTREAM_WING=$(echo "$WING_JSON" | jq -r '.sha' | cut -b 1-7)
          UPSTREAM_CORE=$(echo "$CORE_JSON" | jq -r '.sha' | cut -b 1-7)

          echo "update_needed=true" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$(date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          echo "latest_daed_full=$UPSTREAM_DAED_FULL" >> "$GITHUB_OUTPUT"
          echo "latest_daed_short=$UPSTREAM_DAED" >> "$GITHUB_OUTPUT"
          echo "latest_wing_short=$UPSTREAM_WING" >> "$GITHUB_OUTPUT"
          echo "latest_core_short=$UPSTREAM_CORE" >> "$GITHUB_OUTPUT"

  build:
    needs: check_update
    if: needs.check_update.outputs.update_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build System Setup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm curl jq dos2unix build-essential libncurses5-dev gawk gettext unzip sysstat qemu-utils

      - name: Inject Dynamic Hashes into Makefile
        run: |
          find . -type f -name "Makefile" -exec dos2unix {} \; -print || true
          
          # 安全地更新/插入 Makefile 变量（模式匹配，不依赖行号）
          update_var() {
            local var="$1"
            local val="$2"
            local file="./daed/Makefile"
            
            # 删除旧定义（支持 := 和 = 两种赋值）
            sed -i "/^${var}:=/d" "$file"
            sed -i "/^${var} = /d" "$file"
            
            # 在 PKG_NAME 行之后插入新定义
            if grep -q "^PKG_NAME" "$file"; then
              sed -i "/^PKG_NAME/a ${var}:=${val}" "$file"
            else
              sed -i "1i ${var}:=${val}" "$file"
            fi
          }
          
          update_var "PKG_VERSION" "${{ needs.check_update.outputs.pkg_version }}"
          update_var "DAED_VERSION" "daed-${{ needs.check_update.outputs.latest_daed_short }}"
          update_var "WING_VERSION" "wing-${{ needs.check_update.outputs.latest_wing_short }}"
          update_var "CORE_VERSION" "core-${{ needs.check_update.outputs.latest_core_short }}"
          update_var "PKG_SOURCE_VERSION" "${{ needs.check_update.outputs.latest_daed_full }}"
          
          # 删除 PKG_HASH（如果存在）
          sed -i '/^PKG_HASH/d' ./daed/Makefile
          
          # 删除 PKG_MIRROR_HASH，避免 check 阶段报 "HASH uses deprecated hash"
          sed -i '/^PKG_MIRROR_HASH/d' ./daed/Makefile
          
          # 关键修复1：添加 PKG_SOURCE_SUBMODULES:=skip
          # 这样 DownloadMethod/rawgit 会跳过 git submodule update
          sed -i '/^PKG_SOURCE_SUBMODULES/d' ./daed/Makefile
          sed -i "/^PKG_SOURCE_VERSION/a PKG_SOURCE_SUBMODULES:=skip" ./daed/Makefile
          
          # 关键修复2：修改 PKG_SOURCE_URL 使用 GitHub 镜像，绕过 github_archive 方法
          # 原始 URL: https://github.com/daeuniverse/daed.git
          # 改为: https://github.com.cnpmjs.org/daeuniverse/daed.git
          # 这样 dl_method_git 不会识别为 github.com，直接使用 rawgit（git clone）
          sed -i 's|PKG_SOURCE_URL:=.*|PKG_SOURCE_URL:=https://github.com.cnpmjs.org/daeuniverse/daed.git|' ./daed/Makefile
          
          echo "=== Updated daed/Makefile ==="
          cat ./daed/Makefile
          echo "============================="

      - name: Integrate SDK & Compile Firmware
        uses: sbwml/openwrt-gh-action-sdk@go1.26
        env:
          ARCH: x86_64-openwrt-24.10
          FEEDNAME: packages_ci
          PACKAGES: luci-app-daed daed
          NO_REFRESH_CHECK: true
          V: s
          # Go 代理配置，解决跨境 Go 模块下载问题
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org

      - name: Organize Firmware Files
        id: organize
        run: |
          mkdir -p firmware_release
          # sbwml/openwrt-gh-action-sdk 生成的是软件包(ipk/apk)，不是固件镜像
          # 收集编译好的 ipk/apk 包
          find bin/packages -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp -t firmware_release/ {} + 2>/dev/null || true
          find . -type f \( -name "*.ipk" -o -name "*.apk" \) -not -path "./firmware_release/*" -exec cp -t firmware_release/ {} + 2>/dev/null || true
          
          echo "=== Collected files ==="
          ls -lah firmware_release/ || echo "No packages found"
          echo "======================="
          echo "release_tag=N4100-Bespoke-$(date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload Custom Firmware to Releases
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        with:
          tag_name: ${{ steps.organize.outputs.release_tag }}
          name: Intel N4100 专属定制固件 [${{ steps.organize.outputs.release_tag }}]
          body: |
            🎯 架构：Intel N4100 专属优化 x86_64
            🛡️ 分区：2GB 豪华固件分区（支持 Diskman 一键扩容）
            🚀 核心：集成 FUSE 驱动、Docker 运行环境、Samba4、AList
            🔥 代理：高性能 eBPF 代理服务 DAED 经典对齐
            🌐 默认网段：192.168.2.1 | 网关：192.168.2.254 | 密码：password
          files: firmware_release/*
          token: ${{ secrets.GITHUB_TOKEN }}
